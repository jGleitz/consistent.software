name: Build

on:
  push:
    branches:
      - main
      # Renovate merges most updates without a pull request, so its branches need CI on push
      - "renovate/**"
  pull_request:

concurrency:
  # A new push cancels the outdated run, except on main: there, every commit gets its own group, so that each one is
  # built and we can tell which commit broke the build
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble & Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest

    permissions:
      contents: read
      checks: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only Linux analyses with SonarQube Cloud, which needs the full history for blame and the base branch to find the
          # changes of a pull request. The condition is negated because expressions treat 0 as false: `a && 0 || 1` is always 1.
          fetch-depth: ${{ runner.os != 'Linux' && 1 || 0 }}

      - name: Set Up Development Tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Cache PNPM Store
        # Without node-version, setup-node only caches. It locates the store with the pnpm that mise installed.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          develocity-injection-enabled: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build
        run: ./gradlew build --continue --scan
        env:
          # Publishing the build scan requires agreeing to gradle.com's terms of service (see settings.gradle.kts)
          AGREE_TO_GRADLE_COM_TERMS_OF_SERVICE: "yes"
          # Only Linux checks external links, so that the other operating systems don't send the same requests again
          ORG_GRADLE_PROJECT_checkExternalLinks: ${{ runner.os == 'Linux' }}
          # lychee checks github.com URLs through GitHub's API, which rate-limits anonymous requests
          GITHUB_TOKEN: ${{ github.token }}

      - name: Cache SonarQube Analysers
        if: ${{ runner.os == 'Linux' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Analyse with SonarQube
        if: ${{ runner.os == 'Linux' }}
        run: |
          # GitHub doesn't pass secrets to pull requests from forks
          if [[ -z "$SONAR_TOKEN" ]]; then
            echo "::notice::Not analysing with SonarQube Cloud, because SONAR_TOKEN is not available"
            exit 0
          fi
          ./gradlew sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload Documentation
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: documentation/build/site

      - name: Upload Test Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Test Report creates one report per test-results artifact and names it after the operating system
          name: test-results (${{ matrix.name }})
          path: "**/build/test-results/"

      - name: Try Out mikepenz/action-junit-report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: "**/build/test-results/**/*.xml"
          check_name: JUnit (${{ matrix.name }})
          detailed_summary: true
          include_passed: true
          include_skipped: true
          group_suite: true
          failed_summary_logs: true
          summary: "[Full report with all tests](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

  allure-report:
    name: Allure Report
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: test-results (*)
          path: results
      - name: Generate Report
        run: |
          npm install --no-save --prefix .github/allure-poc allure@3.33.0
          node .github/allure-poc/generate.mjs
          ls -la test-report-all-os.html
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: test-report-all-os.html
          archive: false
          retention-days: 7
      - run: echo "[Open the test report](${{ steps.upload.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
