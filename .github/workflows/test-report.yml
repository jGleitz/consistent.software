# See https://github.com/dorny/test-reporter?tab=readme-ov-file#recommended-setup-for-public-repositories
# for more info on this workflow

name: Test Report

on:
  workflow_run:
    workflows: [Build]
    types:
      - completed

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  add_report:
    name: Annotate Test Results on Pull Request
    runs-on: ubuntu-latest
    # A cancelled build, for example one superseded by a newer push, uploads no test results to report on
    if: github.event.workflow_run.conclusion != 'cancelled'

    steps:
      - id: report
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        # Failing tests turn the reports' checks red, but must not fail this workflow: the build already reports them
        continue-on-error: true
        with:
          # Matches the artifact of each build job and names the report after its operating system
          artifact: /test-results \((.*)\)/
          name: Test Results ($1)
          path: "**/*.xml"
          reporter: java-junit
          # GitHub accepts at most 50 annotations per request, and test-reporter sends one more than this limit
          max-annotations: "49"
          # A build that breaks before its tests run has no test results, and the build already reports that failure itself
          fail-on-empty: "false"
          # Only check runs can carry annotations. Without this, test-reporter writes nothing but the summary of this job.
          use-actions-summary: "false"

      - name: Fail If the Report Could Not Be Created
        # test-reporter sets this output only after creating all reports, so it is 'failure' only if tests failed
        if: steps.report.outcome == 'failure' && steps.report.outputs.conclusion != 'failure'
        run: exit 1
