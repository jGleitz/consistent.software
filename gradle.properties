org.gradle.parallel = true
org.gradle.caching = true
org.gradle.configuration-cache = true
org.gradle.configuration-cache.parallel = true

# In CI, the build exceeds 80 % of the default Metaspace limit of 384 MiB.
# Gradle then stops the daemon instead of reusing it for the next build.
# The heap stays at its default.
org.gradle.jvmargs = -Xmx512m -XX:MaxMetaspaceSize=512m

# JS executable compilation exceeds the default Gradle/Kotlin daemon heap of 512 MiB.
kotlin.daemon.jvmargs = -Xmx2g

# Yarn 1 refuses to run because our root package.json declares pnpm as its package manager.
kotlin.js.yarn = false

# Makes each test task fail on failing tests instead of leaving that to allTests, so that
# the build cache never stores a failed test run as a successful one (see
# multiplatform-tests.gradle.kts).
kotlin.tests.individualTaskReports = true

# The minimal Java version we support. We compile targetting the corresponding class file version.
javaReleaseVersion = 25
# The minimal Kotlin version we support. We compile targetting this version
kotlinReleaseVersion = 2.4
