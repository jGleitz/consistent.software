org.gradle.parallel = true
org.gradle.caching = true
org.gradle.configuration-cache = true
org.gradle.configuration-cache.parallel = true
org.gradle.jvmargs = -XX:MaxMetaspaceSize=768m

# Yarn 1 refuses to run because our root package.json declares pnpm as its package manager.
kotlin.js.yarn = false

# Makes each test task fail on failing tests instead of leaving that to allTests, so that
# the build cache never stores a failed test run as a successful one (see
# multiplatform-tests.gradle.kts).
kotlin.tests.individualTaskReports = true
