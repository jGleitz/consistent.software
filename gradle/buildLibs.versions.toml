# Don’t use the [versions] block to ensure dependencies use the same version. Instead, ensure that Renovate is set up to group their
# updates. Renovate already has rules for many monorepos per default.
[plugins]
kotlin-multiplatform = "org.jetbrains.kotlin.multiplatform:2.4.21"
kover = "org.jetbrains.kotlinx.kover:0.9.11"
sonarqube = "org.sonarqube:7.5.0.8588"

[libraries]
plugin-kotlin-multiplatform = "org.jetbrains.kotlin.multiplatform:org.jetbrains.kotlin.multiplatform.gradle.plugin:2.4.21"
plugin-spotless = "com.diffplug.spotless:com.diffplug.spotless.gradle.plugin:8.11.0"
plugin-kover = "org.jetbrains.kotlinx.kover:org.jetbrains.kotlinx.kover.gradle.plugin:0.9.11"
plugin-kotest = "io.kotest:io.kotest.gradle.plugin:6.2.6"
plugin-ksp = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:2.3.13"
plugin-dokka = "org.jetbrains.dokka:org.jetbrains.dokka.gradle.plugin:2.3.0"
prettier = "npm:prettier:3.10.0"
prettier-plugin-properties = "npm:prettier-plugin-properties:0.3.1"
prettier-plugin-toml = "npm:prettier-plugin-toml:4.1.0"
ktfmt = "com.facebook:ktfmt:0.65"
