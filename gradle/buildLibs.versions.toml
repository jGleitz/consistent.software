# Don’t use the [versions] block to ensure dependencies use the same version. Instead, ensure that Renovate is set up to group their
# updates. Renovate already has rules for many monorepos per default.
[plugins]
kotlin-multiplatform = "org.jetbrains.kotlin.multiplatform:2.4.21"

[libraries]
test-junit = "junit:junit:4.13.2"
plugin-kotlin-multiplatform = "org.jetbrains.kotlin.multiplatform:org.jetbrains.kotlin.multiplatform.gradle.plugin:2.4.21"
plugin-spotless = "com.diffplug.spotless:com.diffplug.spotless.gradle.plugin:8.10.4"
plugin-kotest = "io.kotest:io.kotest.gradle.plugin:6.2.6"
plugin-ksp = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:2.3.12"
plugin-dokka = "org.jetbrains.dokka:org.jetbrains.dokka.gradle.plugin:2.2.0"
