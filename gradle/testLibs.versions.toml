# Don’t use the [versions] block to ensure dependencies use the same version. Instead, ensure that Renovate is set up to group their
# updates. Renovate already has rules for many monorepos per default.

[libraries]
kotest-framework = "io.kotest:kotest-framework-engine:6.2.6"
kotest-property = "io.kotest:kotest-property:6.2.6"
kotest-property-extraArbs = "io.kotest:kotest-property-arbs:3.0.1"
kotest-runner-junit5 = "io.kotest:kotest-runner-junit5:6.2.6"
atrium-fluent = "ch.tutteli.atrium:atrium-fluent:1.2.0"
