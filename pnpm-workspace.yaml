packages:
  - documentation

# Without this, pnpm only checks the root's node_modules and misses broken workspace packages.
optimisticRepeatInstall: false

# Without this, pnpm links every workspace package into node_modules/.pnpm/node_modules. Gradle follows such links when it
# records the outputs of pnpmInstall, so it would also record the packages' build directories, which other tasks change
# concurrently.
hoistWorkspacePackages: false

# The versions of all dependencies. Packages refer to them with `catalog:`.
catalog:
  markdown-it-deflist: 4.0.0
  markdown-it-mathjax3: 4.3.2
  remark-cli: 12.0.1
  remark-gfm: 4.0.1
  remark-validate-links: 13.1.0
  typescript: 7.0.2
  vitepress: 2.0.0-alpha.20
  vue: 3.5.44
